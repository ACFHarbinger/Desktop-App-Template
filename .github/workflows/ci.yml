name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure

  lint-test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras --dev
        working-directory: backend
      - run: uv run ruff check .
        working-directory: backend
      - run: uv run mypy src
        working-directory: backend
      - run: uv run pytest test -v --cov=src --cov-report=xml
        working-directory: backend

  lint-test-gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: sudo apt-get update && sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0
        continue-on-error: true
      - run: uv sync --all-extras --dev
        working-directory: gui
      - run: uv run ruff check .
        working-directory: gui
      - run: uv run pytest test -v
        working-directory: gui
