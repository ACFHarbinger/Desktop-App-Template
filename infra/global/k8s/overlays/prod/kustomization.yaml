apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: desktop-app-repo-prod

resources:
  - ../../base

patches:
  - target:
      kind: Deployment
      name: desktop-app-repo
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: desktop-app-repo:latest
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "1"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "1Gi"
