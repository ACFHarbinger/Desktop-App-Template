apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: desktop-app-repo
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: desktop-app-repo.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: desktop-app-repo
                port:
                  number: 80
