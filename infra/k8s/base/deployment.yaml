apiVersion: apps/v1
kind: Deployment
metadata:
  name: desktop-app-repo
  labels:
    app: desktop-app-repo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: desktop-app-repo
  template:
    metadata:
      labels:
        app: desktop-app-repo
    spec:
      containers:
        - name: app
          # TODO: point at your real registry once infra/docker/Dockerfile is published there.
          image: desktop-app-repo:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: desktop-app-repo-config
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
